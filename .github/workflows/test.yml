name: Tests

# Typecheck, unit tests and the coverage gate: the run fails, with an error
# on the PR, when types break (which breaks the deploy's build), tests fail,
# or tests cover under 95% of lines or functions in src/

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # the version flake.nix pins
      - run: bun install --frozen-lockfile
      - run: bunx tsc -b
      - run: bun run test
