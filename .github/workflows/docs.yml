name: Docs

# Fails when docs/ falls behind the code: a stale `covers` path, code no doc
# covers, a Worker setting missing from docs/operations.md, or (on a PR) a
# changed file whose docs didn't change. See docs/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: re-check when "Docs: not needed" is added
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the PR check diffs against the base branch
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # the version flake.nix pins
      - if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: origin/${{ github.base_ref }}
        run: bun scripts/check-docs.ts --base "$BASE"
      - if: github.event_name != 'pull_request'
        run: bun scripts/check-docs.ts
