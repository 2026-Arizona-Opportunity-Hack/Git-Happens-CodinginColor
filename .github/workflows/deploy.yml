name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

# One deploy at a time; a newer push cancels an in-flight one.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://githappens.jurenka.software
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # The bundle comes from the flake, the same `nix build` anyone can run
      - run: nix build
      - run: cp -r --no-preserve=mode result/dist result/.wrangler .

      # wrangler itself comes from bun.lock, run inside the flake's devshell
      - run: nix develop -c bun install --frozen-lockfile

      # Schema changes ship before the code that needs them
      - run: nix develop -c bunx wrangler d1 migrations apply DB --remote
      - run: nix develop -c bunx wrangler deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
